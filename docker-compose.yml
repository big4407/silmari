services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306" # 호스트에서 직접 붙어볼 때만 필요
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      DB_HOST: db
    volumes:
      - ./data:/app/data
      # FashionCLIP(HuggingFace) 모델 캐시 — 볼륨 없이는 컨테이너를 재생성할
      # 때마다(docker compose down/up --build 등) 이 캐시가 사라져서, 매번
      # HF_HUB_OFFLINE=false로 다시 다운로드해야 하는 문제가 반복된다.
      # 이름 있는 볼륨이라 down -v 로 명시적으로 지우기 전까진 유지된다.
      - hf_cache:/root/.cache/huggingface
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  mysql_data:
  hf_cache: